name: Refresh data and deploy Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - 'data/**'
  schedule:
    - cron: '35 0 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bitcoin-market-monitor-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python scripts/market.py
      - name: Commit updated public market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh daily observations"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::warning::Data commit could not be pushed; deployment continues using the generated snapshot."
              fi
            done
          fi
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
